# The database is hosted in the cloud (DATABASE_URL), so there is no local DB container.
services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      ANALYTICS_SERVICE_URL: http://analytics:8000
    depends_on:
      - analytics

  analytics:
    build: ./analytics
    env_file: ./analytics/.env
